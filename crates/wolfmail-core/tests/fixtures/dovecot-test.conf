# Full dovecot.conf for local integration tests (replaces the dovecot/dovecot:2.3.21 image's own file).
# Plain LOGIN on 143 is acceptable only because the container is published on 127.0.0.1 for tests.
mail_home=/srv/mail/%Lu
mail_location=sdbox:~/Mail
mail_uid=1000
mail_gid=1000
protocols = imap
first_valid_uid = 1000
last_valid_uid = 1000
passdb {
  driver = static
  args = password=pass
}
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
listen = *
log_path=/dev/stdout
