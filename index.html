<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preload" href="/fonts/righteous-regular.woff2" as="font" type="font/woff2" crossorigin />
    <title>WolfMail</title>
    <!-- Splash styles live in /splash.css, not inline: an inline style element here makes Tauri put a hash into the CSP's
         style-src, after which WebKit ignores 'unsafe-inline' and every email frame (which inherits the CSP) loses
         its styling. -->
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div id="wm-splash" role="status" aria-label="Opening WolfMail">
      <img src="/icon.png" alt="" />
      <div class="wm-name">WolfMail</div>
      <div class="wm-by">by IntelligentWolf</div>
      <div class="wm-bar" aria-hidden="true"></div>
      <div class="wm-status">Opening your mail…</div>
    </div>
    <script src="/boot.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
