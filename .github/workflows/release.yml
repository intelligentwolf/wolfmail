# Release: push a tag like v0.2.0 → every platform is built, update bundles are signed with the Tauri updater key,
# and a GitHub release is published with latest.json for in-app updates.
#
# WHERE releases go: this repo's own Releases (it is public, so the in-app updater — tauri.conf.json
# plugins.updater.endpoints — can read latest.json without a login). Published with the workflow's own GITHUB_TOKEN.
#
# Secrets this workflow needs (set by Paul in the repo's Settings → Secrets):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   from ~/.tauri/wolfmail.key(.password)
#   WOLFMAIL_GOOGLE_CLIENT_ID / _SECRET, WOLFMAIL_MS_CLIENT_ID      OAuth app ids (optional; sign-in says "not set up" without)
#   AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   AZURE_TENANT_ID   Windows code signing via Azure Artifact Signing (optional; unsigned without). No Apple signing.
#
# Action SHAs: see build.yml header (same pins).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload the installers

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - os: windows-latest
            args: "--bundles msi,nsis"
          - os: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg,app"
            target: aarch64-apple-darwin
          - os: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg,app"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm
      - name: Rust target
        if: matrix.target != ''
        shell: bash
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: npm ci
      # Windows code signing — IntelligentWolf Ltd's Azure Artifact (Trusted) Signing account, the same Microsoft-issued
      # identity that signs WolfViewer (signer "IntelligentWolf Ltd", issuer "Microsoft ID Verified CS EOC CA 03").
      # Source: Tauri docs, distribute/sign/windows "Azure Artifact Signing" (artifact-signing-cli + bundle.windows.
      # signCommand; AZURE_CLIENT_ID/SECRET/TENANT_ID from an App Registration with the signer role). Skipped, and the
      # installers ship unsigned, until the AZURE_* secrets exist.
      - name: Windows code signing (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.AZURE_SIGNING_ENDPOINT != '' && env.AZURE_CLIENT_ID != ''
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          cargo install artifact-signing-cli --version 0.12.0 --locked
          printf '{"bundle":{"windows":{"signCommand":"artifact-signing-cli -e %s -a %s -c %s -d WolfMail %%1"}}}' \
            "$AZURE_SIGNING_ENDPOINT" "$AZURE_SIGNING_ACCOUNT" "$AZURE_SIGNING_PROFILE" > src-tauri/tauri.sign.conf.json
          echo "SIGN_ARGS=--config src-tauri/tauri.sign.conf.json" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WOLFMAIL_GOOGLE_CLIENT_ID: ${{ secrets.WOLFMAIL_GOOGLE_CLIENT_ID }}
          WOLFMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.WOLFMAIL_GOOGLE_CLIENT_SECRET }}
          WOLFMAIL_MS_CLIENT_ID: ${{ secrets.WOLFMAIL_MS_CLIENT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WolfMail ${{ github.ref_name }}"
          releaseBody: "Download the installer for your computer below. WolfMail updates itself after this."
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

  # Checksums, build provenance and keyless signatures for every published file — the same as WolfStack's release
  # (Source: wolfscale/wolfstack/.github/workflows/release.yml "Compute SHA-256 checksums", "Generate build-provenance
  # attestation", "Sign binaries with cosign (keyless)"; same action pins and cosign v2.4.1).
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload SHA256SUMS + bundles, edit the notes
      id-token: write       # cosign keyless OIDC + attest provenance
      attestations: write   # actions/attest-build-provenance
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the release's files
        run: |
          mkdir dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -la dist

      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate build-provenance attestation
        # Before signing, so the subjects are only the published files (not the .cosign.bundle files).
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign every file with cosign (keyless)
        # No private key: the signing identity is this workflow, anchored to Sigstore's Fulcio CA and Rekor log.
        run: |
          cd dist
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      - name: Upload checksums and signatures
        run: gh release upload "$TAG" dist/SHA256SUMS dist/*.cosign.bundle --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add verification steps to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          cat >> notes.md <<'NOTES'

          ---

          ## Verifying this release

          Every file is signed with [cosign](https://docs.sigstore.dev/) keyless OIDC (the signing identity is this
          repository's release workflow, anchored to the Sigstore Fulcio CA and the Rekor transparency log) and has a
          [SLSA build provenance](https://slsa.dev/spec/v1.0/provenance) attestation.

          **Verify the SHA-256 checksum** (in the folder you downloaded to):
          ```
          sha256sum -c SHA256SUMS --ignore-missing
          ```
          On Windows (PowerShell): `Get-FileHash .\<file> -Algorithm SHA256` and compare with `SHA256SUMS`.
          On macOS: `shasum -a 256 -c SHA256SUMS --ignore-missing`.

          **Verify the build provenance:**
          ```
          gh attestation verify <file> --repo intelligentwolf/wolfmail
          ```

          **Verify the cosign signature:**
          ```
          cosign verify-blob \
            --bundle <file>.cosign.bundle \
            --certificate-identity-regexp 'https://github.com/intelligentwolf/wolfmail/\.github/workflows/release\.yml@.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            <file>
          ```
          NOTES
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
